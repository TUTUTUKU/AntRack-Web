# 蚁仓 Ant Rack System (ANS) V1.0 — Docker Compose 一键部署
# 制作者：TUTUTUKU  项目编号：TK02  工程名：AntRack
# 适配：NAS / AIO 主机 / Windows Docker Desktop / Linux 服务器 · 7×24 小时挂机
# 架构：✅ linux/amd64（x86 PC / 服务器）  ✅ linux/arm64（树莓派 4B+ / 飞牛 / 极空间 / Mac M 系列）
# 基础镜像均为 Docker Hub 官方多架构镜像，buildx 可同时产出两种架构
# ============================================================
# 【用法一】本机直接构建部署（按当前宿主机架构自动匹配：amd64 或 arm64）
#   在本目录打开 PowerShell / CMD / Bash：
#     docker compose up -d --build
#   首次会拉镜像 + 构建前端（1~3 分钟），以后 docker compose start 秒起
#   浏览器 → http://localhost:8080  或  http://<本机IP>:8080
#   App 填后端地址 →  http://<本机IP>:8000
#   停止   : docker compose stop
#   看日志 : docker compose logs -f backend / frontend
#   卸载   : docker compose down          (只删容器，不删 data/static 数据卷)
# ============================================================
# 【用法三】Ubuntu / 服务器拉取 GitHub 已编译镜像更新（无需本地构建）
#   首次部署：git clone 本仓库 → cd antrack-web
#   以后每次更新（数据不丢）：
#     git pull                                   # 拉取最新 compose 配置
#     docker compose pull backend frontend       # 拉取 GHCR 最新镜像
#     docker compose up -d --force-recreate      # 用新镜像重启容器
#   镜像地址：ghcr.io/tututuku/antrack-backend:latest
#             ghcr.io/tututuku/antrack-frontend:latest
#   说明：image 与 build 共存时，pull 优先拉远程镜像，本地 --build 才构建
# ============================================================
# 【用法二】多架构镜像（同时出 amd64 + arm64，推送到私有/公共仓库后任意机器拉取）
#   Windows / Mac（Docker Desktop 自带 buildx）：
#     1) docker buildx create --use --name antrack-builder  (首次只需一次)
#     2) cd backend  && docker buildx build --platform linux/amd64,linux/arm64 -t <你的仓库>/antrack-backend:latest --push .
#     3) cd frontend && docker buildx build --platform linux/amd64,linux/arm64 -t <你的仓库>/antrack-frontend:latest --push .
#     4) 在另一台机器的 compose 里把 build: 改成 image: <你的仓库>/antrack-xxx:latest 即可直接 pull 启动
# ============================================================
# 【生产环境必改】
#   - 在本文件 services.backend.environment 或 docker run -e 注入：
#       ANTRACK_SECRET_KEY=<32位以上随机字符串>
#       ANTRACK_DEFAULT_ADMIN_PASSWORD=<改掉默认 admin123>
#   - 部署后立刻登录 → 系统设置 → 修改密码
# ============================================================
# 【更新镜像铁规 —— 100% 不丢旧数据】
#   ① 更新前先在系统设置里点一次「数据备份与恢复 → 下载备份」
#      把 .antrack 文件另存到本地电脑（双重保险，回滚兜底）
#   ② 拉/建新镜像（只动镜像层，不碰容器与数据卷）：
#        docker compose build --no-cache backend frontend
#        # 或拉远程镜像：docker compose pull backend frontend
#   ③ 逐个重启服务（保留数据卷，只替换容器层代码）：
#        docker compose up -d --force-recreate backend
#        docker compose up -d --force-recreate frontend
#   ④ 验证：浏览器打开 http://<本机IP>:8080 看仪表盘数据是否还在
#   ❌ 绝对禁止：docker compose down -v          （-v 会删命名卷，数据清零）
#   ❌ 绝对禁止：docker volume rm antrack_*      （同上）
#   ❌ 绝对禁止：在 Portainer 里点「删除数据卷」  （同上）
#   ❌ 绝对禁止：把 backend/data/*.db 写进 Dockerfile 的 COPY
#               （镜像内自带空 DB，第一次启动可能覆盖挂载点的真实数据）
#   ✅ 安全做法：永远用 volumes 挂载 ./backend/data 与 ./backend/static
#               代码更新只重建镜像并 up -d 重启，绝不动数据卷
# ============================================================
version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # 如需强制指定架构（例如在 amd64 机器上交叉构建 arm64 镜像），取消下行注释并改成目标平台：
      # platforms:
      #   - "linux/arm64"
    image: ghcr.io/tututuku/antrack-backend:latest
    container_name: antrack-backend
    restart: always
    # ===== 生产环境密钥注入（示例，去掉 # 即可生效）=====
    # environment:
    #   - ANTRACK_SECRET_KEY=please-change-me-to-a-long-random-string
    #   - ANTRACK_DEFAULT_ADMIN_USERNAME=admin
    #   - ANTRACK_DEFAULT_ADMIN_PASSWORD=please-change-me-after-first-login
    volumes:
      # SQLite 数据库文件持久化（容器重建不丢库存数据）
      - ./backend/data:/app/data
      # 上传图片目录持久化
      - ./backend/static:/app/static
    # ------------------------------
    # 关键：手机 App 需要局域网直接连后端 API 8000
    # expose 只对同 compose 其他容器可见，ports 才能对外暴露到宿主机网卡
    ports:
      - "8000:8000"
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3); sys.exit(0 if r.status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - stock-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ghcr.io/tututuku/antrack-frontend:latest
    container_name: antrack-frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"   # 宿主机 8080 映射到 Nginx 80
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - stock-net

networks:
  stock-net:
    driver: bridge
