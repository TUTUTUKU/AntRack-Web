name: Build & Push Multi-Arch Docker Images

# 触发：push 到 main 分支 / 手动运行
# 产物：backend + frontend 两个镜像，同时支持 amd64 + arm64，推送到 GHCR
# Ubuntu 拉取：docker compose pull backend frontend && docker compose up -d --force-recreate

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 同时构建后端 + 前端两个镜像（并行跑，互不阻塞）
        service: [backend, frontend]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # GHCR 要求镜像名全小写，仓库 owner 可能含大写字母，先转小写
      - name: Lowercase owner (GHCR 要求镜像名全小写)
        run: echo "OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Setup QEMU for multi-arch
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 构建多架构镜像并推送，打两个标签：latest + commit 短 SHA（方便回滚）
      - name: Build & Push ${{ matrix.service }} (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/antrack-${{ matrix.service }}:latest
            ghcr.io/${{ env.OWNER_LC }}/antrack-${{ matrix.service }}:${{ github.sha }}
          # 用 GitHub Actions 缓存加速后续构建
          cache-from: type=gha
          cache-to: type=gha,mode=max
